<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Happy Birthday Kak Ola 🎂</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; overflow: hidden; font-family: "Comic Sans MS", cursive, sans-serif; background: linear-gradient(135deg, #ffd6e7, #d8f3ff, #fff2b8); display: flex; justify-content: center; align-items: center; } .container { text-align: center; position: relative; z-index: 5; } h1 { font-size: 42px; color: #ff4f91; text-shadow: 3px 3px white; animation: bounce 1.5s infinite; } .subtitle { font-size: 20px; color: #555; margin-bottom: 15px; } /* Boneka */ .bear { width: 170px; height: 150px; background: #c98b5b; border-radius: 50%; margin: 20px auto; position: relative; animation: dance 1s infinite alternate; box-shadow: 0 10px 20px rgba(0,0,0,.15); } .ear { width: 55px; height: 55px; background: #c98b5b; border-radius: 50%; position: absolute; top: -15px; } .ear.left { left: 5px; } .ear.right { right: 5px; } .eye { width: 15px; height: 15px; background: #222; border-radius: 50%; position: absolute; top: 55px; } .eye.left { left: 45px; } .eye.right { right: 45px; } .nose { width: 25px; height: 18px; background: #3b2417; border-radius: 50%; position: absolute; top: 78px; left: 72px; } .mouth { width: 45px; height: 20px; border-bottom: 4px solid #3b2417; border-radius: 50%; position: absolute; top: 90px; left: 62px; } button { border: none; background: #ff5c9d; color: white; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #d93678; transition: .2s; } button:hover { transform: translateY(3px); box-shadow: 0 3px 0 #d93678; } #message { display: none; margin-top: 20px; background: rgba(255,255,255,.8); padding: 18px; border-radius: 20px; color: #ff4081; font-size: 20px; max-width: 350px; margin-left: auto; margin-right: auto; animation: pop .5s ease; } /* Balon */ .balloon { position: absolute; width: 55px; height: 70px; border-radius: 50%; animation: float 4s infinite ease-in-out; } .b1 { background:#ff6b81; left:8%; top:15%; } .b2 { background:#6bc5ff; right:10%; top:20%; animation-delay:1s; } .b3 { background:#ffd93d; left:15%; bottom:10%; animation-delay:2s; } .b4 { background:#a66cff; right:15%; bottom:12%; animation-delay:1.5s; } .balloon::after { content:""; position:absolute; width:2px; height:80px; background:#777; top:65px; left:27px; } /* Konfeti */ .confetti { position:absolute; width:10px; height:10px; background:#ff4081; animation: fall 3s linear infinite; } @keyframes bounce { 50% { transform: translateY(-10px); } } @keyframes dance { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } } @keyframes float { 50% { transform: translateY(-30px) rotate(8deg); } } @keyframes pop { from { transform: scale(.5); opacity:0; } to { transform: scale(1); opacity:1; } } @keyframes fall { from { top:-20px; transform:rotate(0deg); } to { top:110vh; transform:rotate(720deg); } } </style> </head> <body> <div class="balloon b1"></div> <div class="balloon b2"></div> <div class="balloon b3"></div> <div class="balloon b4"></div> <div class="container"> <h1>🎉 HAPPY BIRTHDAY 🎉</h1> <div class="subtitle"> Untuk Kak Ola tercinta 💕 </div> <div class="bear"> <div class="ear left"></div> <div class="ear right"></div> <div class="eye left"></div> <div class="eye right"></div> <div class="nose"></div> <div class="mouth"></div> </div> <button onclick="surprise()"> 🎁 KLIK UNTUK KEJUTAN! </button> <div id="message"> 🎂 Selamat ulang tahun, Kak Ola! 🎂<br><br> Semoga panjang umur, sehat selalu, semakin bahagia, semakin sukses, dan semua impian Kak Ola bisa tercapai! ✨💖 <br><br> Jangan lupa traktirannya ya! 😂🎉 </div> </div> <script> function surprise() { document.getElementById("message").style.display = "block"; // Membuat konfeti for (let i = 0; i < 80; i++) { let confetti = document.createElement("div"); confetti.className = "confetti"; confetti.style.left = Math.random() * 100 + "vw"; confetti.style.background = ["#ff4081","#ffd93d","#6bc5ff","#a66cff","#55efc4"] [Math.floor(Math.random() * 5)]; confetti.style.animationDuration = (2 + Math.random() * 3) + "s"; confetti.style.animationDelay = Math.random() * 2 + "s"; document.body.appendChild(confetti); setTimeout(() => { confetti.remove(); }, 6000); } // Suara sederhana let audio = new Audio( "https://actions.google.com/sounds/v1/celebration/party_horn.ogg" ); audio.play().catch(() => {}); } </script> </body> </html>
